<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuración · SmartPrint</title><link rel="stylesheet" href="pages.css"></head>
<body class="options"><main class="card"><p class="eyebrow">Configuración</p><h1>SmartPrint</h1><form id="settings-form"><label>Perfil o puesto<input id="profile" type="text" maxlength="80" placeholder="default"></label><label>Ancho de papel<select id="paper-width"><option value="48">48 mm</option><option value="58">58 mm</option><option value="80">80 mm</option></select></label><label>Escala (%)<input id="scale" type="number" min="50" max="150" step="5"></label><label>Plantilla<select id="template-mode"><option value="universal">Universal estilo Contica</option><option value="original">Mantener original cuando sea posible</option></select></label><label class="check"><input id="confirm-ambiguous" type="checkbox"> Confirmar documentos ambiguos</label><label class="check"><input id="remember-preferences" type="checkbox"> Recordar preferencias</label><label class="check"><input id="header-enabled" type="checkbox"> Incluir encabezado compatible</label><p id="legacy-summary"></p><button class="primary" type="submit">Guardar</button><p id="options-status" role="status" aria-live="polite"></p></form></main><script src="../core/settings-adapter.js"></script><script src="options.js"></script></body></html>
