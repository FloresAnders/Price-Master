<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TimeMaster Herramientas</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="heading">
        <div>
          <h1>TimeMaster Herramientas</h1>
          <p>Contica y Gente Crystal</p>
        </div>
      </header>

      <section class="features" aria-label="Herramientas disponibles">
        <label class="feature" for="tmhCambioTabEnabled-toggle">
          <span class="feature__copy">
            <strong>CambioTab</strong>
            <small>Atajos para cambiar pestañas en Contica.</small>
          </span>
          <span class="feature__control">
            <span id="tmhCambioTabEnabled-status" class="status" aria-live="polite">Activado</span>
            <span class="switch">
              <input id="tmhCambioTabEnabled-toggle" type="checkbox" role="switch">
              <span class="slider" aria-hidden="true"></span>
            </span>
          </span>
        </label>

        <div class="feature feature--stacked">
          <div class="feature__row">
            <span class="feature__copy">
              <strong>Cerrar impresión en Contica</strong>
              <small>Pulsa X / ESC después del tiempo configurado.</small>
            </span>
            <span class="feature__control">
              <span id="tmhCerrarImpresionConticaEnabled-status" class="status" aria-live="polite">Desactivado</span>
              <label class="switch" for="tmhCerrarImpresionConticaEnabled-toggle">
                <input id="tmhCerrarImpresionConticaEnabled-toggle" type="checkbox" role="switch">
                <span class="slider" aria-hidden="true"></span>
              </label>
            </span>
          </div>
          <label class="delay-field" for="tmhCerrarImpresionConticaDelaySeconds-input">
            <span>Tiempo para cerrar</span>
            <span class="delay-field__input">
              <input id="tmhCerrarImpresionConticaDelaySeconds-input" type="number" min="1" step="1" inputmode="numeric">
              <span>segundos</span>
            </span>
            <span id="tmhCerrarImpresionConticaDelaySeconds-status" class="delay-field__status" aria-live="polite"></span>
          </label>
          <label class="message-field" for="tmhCerrarImpresionConticaMessage-input">
            <span>Mensaje del recordatorio</span>
            <textarea id="tmhCerrarImpresionConticaMessage-input" rows="3"></textarea>
            <span id="tmhCerrarImpresionConticaMessage-status" class="message-field__status" aria-live="polite"></span>
          </label>
        </div>

        <label class="feature" for="tmhDividirEfectivoEnabled-toggle">
          <span class="feature__copy">
            <strong>Dividir efectivo</strong>
            <small>Calcula montos escritos como 7500/2 en USD o CRC.</small>
          </span>
          <span class="feature__control">
            <span id="tmhDividirEfectivoEnabled-status" class="status" aria-live="polite">Desactivado</span>
            <span class="switch">
              <input id="tmhDividirEfectivoEnabled-toggle" type="checkbox" role="switch">
              <span class="slider" aria-hidden="true"></span>
            </span>
          </span>
        </label>

        <label class="feature" for="tmhMoverPagoEnabled-toggle">
          <span class="feature__copy">
            <strong>Mover monto de pago</strong>
            <small>Usa E, T o S para efectivo, tarjeta o SINPE.</small>
          </span>
          <span class="feature__control">
            <span id="tmhMoverPagoEnabled-status" class="status" aria-live="polite">Desactivado</span>
            <span class="switch">
              <input id="tmhMoverPagoEnabled-toggle" type="checkbox" role="switch">
              <span class="slider" aria-hidden="true"></span>
            </span>
          </span>
        </label>

        <label class="feature" for="tmhSumaTiemposEnabled-toggle">
          <span class="feature__copy">
            <strong>SumaTiempos</strong>
            <small>Total en vivo en Gente Crystal.</small>
          </span>
          <span class="feature__control">
            <span id="tmhSumaTiemposEnabled-status" class="status" aria-live="polite">Activado</span>
            <span class="switch">
              <input id="tmhSumaTiemposEnabled-toggle" type="checkbox" role="switch">
              <span class="slider" aria-hidden="true"></span>
            </span>
          </span>
        </label>

        <label class="feature" for="tmhIngresarVentaEnabled-toggle">
          <span class="feature__copy">
            <strong>Ingresar venta con Ctrl+Enter</strong>
            <small>Pulsa Ingresar venta desde el teclado.</small>
          </span>
          <span class="feature__control">
            <span id="tmhIngresarVentaEnabled-status" class="status" aria-live="polite">Desactivado</span>
            <span class="switch">
              <input id="tmhIngresarVentaEnabled-toggle" type="checkbox" role="switch">
              <span class="slider" aria-hidden="true"></span>
            </span>
          </span>
        </label>

        <label class="feature" for="tmhMoverEnterEnabled-toggle">
          <span class="feature__copy">
            <strong>Impresión automática</strong>
            <small>Pulsa Imprimir cuando aparece el modal.</small>
          </span>
          <span class="feature__control">
            <span id="tmhMoverEnterEnabled-status" class="status" aria-live="polite">Desactivado</span>
            <span class="switch">
              <input id="tmhMoverEnterEnabled-toggle" type="checkbox" role="switch">
              <span class="slider" aria-hidden="true"></span>
            </span>
          </span>
        </label>
      </section>

      <p class="hint">
        Para omitir la confirmación final de impresión, inicia Edge con
        <code>--kiosk-printing</code>.
      </p>
    </main>
    <script src="settings-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
