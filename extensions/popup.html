<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas Gente Crystal</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>TimeMaster</h1>
      <p>Ventas detectadas en Gente Crystal</p>
    </div>
    <span id="contador">0</span>
  </header>

  <main>
    <div id="estado" class="status">Comprobando detector…</div>

    <section class="sync-panel" aria-labelledby="sync-title">
      <div class="sync-heading">
        <div>
          <h2 id="sync-title">Sincronización con TimeMaster</h2>
          <p id="sync-status">Comprobando cola…</p>
        </div>
        <span id="sync-indicator" class="sync-indicator">Sin configurar</span>
      </div>

      <div class="settings-grid">
        <label for="api-url">
          URL de TimeMaster
          <input
            id="api-url"
            type="url"
            value="https://timemaster.es"
            autocomplete="url"
            spellcheck="false"
          >
        </label>
        <label for="device-token">
          Token del dispositivo
          <input
            id="device-token"
            type="password"
            placeholder="tm_gc_…"
            autocomplete="off"
            spellcheck="false"
          >
        </label>
        <button id="guardar-config" type="button" class="primary">
          Guardar conexión
        </button>
      </div>
      <p id="config-message" class="config-message" aria-live="polite"></p>
    </section>

    <div class="toolbar">
      <button id="recargar" type="button">Escanear ahora</button>
      <button id="limpiar" type="button" class="danger">Limpiar</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Hora</th>
            <th>Sorteo</th>
            <th class="right">Monto</th>
          </tr>
        </thead>
        <tbody id="ventas"></tbody>
      </table>
      <div id="vacio" class="empty">Todavía no hay ventas detectadas.</div>
    </div>
  </main>

  <script src="sync-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
