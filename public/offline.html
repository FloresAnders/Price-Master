<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Sin conexión | Time Master</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d1117;
        color: #f8fafc;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
        padding: 32px;
        border: 1px solid #334155;
        border-radius: 18px;
        background: #111827;
        box-shadow: 0 24px 60px rgb(0 0 0 / 35%);
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.6rem;
      }
      p {
        margin: 0 0 24px;
        color: #cbd5e1;
        line-height: 1.55;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        background: #2563eb;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/android-chrome-192x192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>Time Master necesita internet para cargar datos actualizados y proteger la información de tu cuenta.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
